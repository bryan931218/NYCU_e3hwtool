{% if (admin_user and admin_user.is_admin) or (user and user.is_admin) %}
<style>
    .e3-ai-shell{--e3-ai-ink:#18324a;--e3-ai-muted:#6b7f93;--e3-ai-line:#dbe6ef;--e3-ai-blue:#1769d8;--e3-ai-teal:#0d8f8d;position:fixed;right:20px;bottom:20px;z-index:2147483000;font-family:Inter,"Noto Sans TC",system-ui,-apple-system,sans-serif}
    .e3-ai-launch{width:52px;height:52px;display:grid;place-items:center;margin-left:auto;color:#fff;border:0;border-radius:18px;background:linear-gradient(145deg,#1769d8,#0d8f8d);box-shadow:0 12px 30px rgba(12,79,133,.28);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
    .e3-ai-launch:hover{transform:translateY(-2px);box-shadow:0 15px 34px rgba(12,79,133,.34)}.e3-ai-launch:focus-visible{outline:3px solid rgba(23,105,216,.24);outline-offset:3px}.e3-ai-launch svg{width:23px;height:23px;stroke-width:1.8}.e3-ai-launch .close-icon,.e3-ai-shell.is-open .e3-ai-launch .chat-icon{display:none}.e3-ai-shell.is-open .e3-ai-launch .close-icon{display:block}
    .e3-ai-panel{position:absolute;right:0;bottom:66px;width:min(430px,calc(100vw - 28px));height:min(640px,calc(100vh - 106px));display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;color:var(--e3-ai-ink);border:1px solid rgba(197,214,228,.9);border-radius:20px;background:rgba(255,255,255,.98);box-shadow:0 24px 70px rgba(24,50,74,.23);transform-origin:bottom right}.e3-ai-panel[hidden]{display:none}
    .e3-ai-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid var(--e3-ai-line);background:linear-gradient(135deg,#f7fbff,#f3fbfa)}.e3-ai-identity{display:flex;align-items:center;gap:10px;min-width:0}.e3-ai-mark{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;color:#fff;border-radius:12px;background:linear-gradient(145deg,#1769d8,#0d8f8d);font-size:11px;font-weight:900}.e3-ai-head strong{display:block;font-size:14px}.e3-ai-head small{display:block;margin-top:2px;color:var(--e3-ai-muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.e3-ai-reset{padding:7px 9px;color:var(--e3-ai-muted);border:1px solid var(--e3-ai-line);border-radius:9px;background:#fff;font-size:11px;font-weight:800;cursor:pointer}
    .e3-ai-messages{min-height:0;display:flex;flex-direction:column;gap:10px;padding:15px;overflow:auto;overscroll-behavior:contain;background:#fbfdff}.e3-ai-empty{margin:auto;padding:24px;text-align:center;color:var(--e3-ai-muted);font-size:12px;line-height:1.7}.e3-ai-empty strong{display:block;margin-bottom:5px;color:var(--e3-ai-ink);font-size:16px}.e3-ai-message{max-width:88%;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.e3-ai-message.user{align-self:flex-end;color:#fff;border-bottom-right-radius:5px;background:var(--e3-ai-blue)}.e3-ai-message.assistant{align-self:flex-start;border:1px solid var(--e3-ai-line);border-bottom-left-radius:5px;background:#fff}.e3-ai-message.error{color:#a72f3c;border-color:#efc6cb;background:#fff6f7}.e3-ai-thinking{display:inline-flex;gap:4px}.e3-ai-thinking i{width:6px;height:6px;border-radius:50%;background:#8aa1b6;animation:e3-ai-pulse 1s infinite alternate}.e3-ai-thinking i:nth-child(2){animation-delay:.16s}.e3-ai-thinking i:nth-child(3){animation-delay:.32s}@keyframes e3-ai-pulse{to{opacity:.28;transform:translateY(-2px)}}
    .e3-ai-proposal{align-self:stretch;padding:13px;border:1px solid #bcd8d6;border-radius:15px;background:#f4fbfa}.e3-ai-proposal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.e3-ai-proposal-head strong{font-size:13px}.e3-ai-badge{padding:3px 7px;color:#08716f;border-radius:999px;background:#dff4f1;font-size:10px;font-weight:900}.e3-ai-proposal p{margin:7px 0;color:var(--e3-ai-muted);font-size:12px;line-height:1.55}.e3-ai-proposal .e3-ai-result{padding:8px 10px;color:#08716f;border-radius:9px;background:#e5f6f2;font-weight:800}.e3-ai-changes{display:grid;gap:6px;margin:9px 0}.e3-ai-change{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;padding-top:6px;border-top:1px solid rgba(13,143,141,.13);font-size:11px}.e3-ai-change span:first-child{color:var(--e3-ai-muted)}.e3-ai-change span:last-child{font-weight:750}.e3-ai-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}.e3-ai-action{min-height:34px;padding:0 12px;border:1px solid var(--e3-ai-line);border-radius:10px;background:#fff;color:var(--e3-ai-ink);font-size:11px;font-weight:900;cursor:pointer}.e3-ai-action.primary{color:#fff;border-color:var(--e3-ai-teal);background:var(--e3-ai-teal)}.e3-ai-action:disabled{opacity:.55;cursor:wait}
    .e3-ai-form{padding:12px 14px 14px;border-top:1px solid var(--e3-ai-line);background:#fff}.e3-ai-compose{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;padding:7px 7px 7px 11px;border:1px solid #c9d8e5;border-radius:14px;background:#fff;transition:border-color .16s,box-shadow .16s}.e3-ai-compose:focus-within{border-color:var(--e3-ai-blue);box-shadow:0 0 0 3px rgba(23,105,216,.09)}.e3-ai-input{width:100%;min-height:38px;max-height:112px;padding:8px 0;border:0;outline:0;resize:none;color:var(--e3-ai-ink);background:transparent;font:inherit;font-size:13px;line-height:1.5}.e3-ai-send{width:38px;height:38px;display:grid;place-items:center;color:#fff;border:0;border-radius:11px;background:var(--e3-ai-blue);cursor:pointer}.e3-ai-send:disabled{opacity:.5;cursor:wait}.e3-ai-send svg{width:18px}.e3-ai-hint{display:flex;justify-content:space-between;gap:8px;margin-top:7px;color:var(--e3-ai-muted);font-size:10px}.e3-ai-hint button{padding:0;color:var(--e3-ai-teal);border:0;background:none;font:inherit;font-weight:800;cursor:pointer}
    @media(max-width:620px){.e3-ai-shell{right:12px;bottom:12px}.e3-ai-panel{position:fixed;left:10px;right:10px;bottom:76px;width:auto;height:min(72vh,620px);border-radius:18px}.e3-ai-launch{width:50px;height:50px;border-radius:17px}.e3-ai-message{max-width:92%}}
    @media(prefers-reduced-motion:reduce){.e3-ai-launch,.e3-ai-thinking i{transition:none;animation:none}}
</style>
<aside class="e3-ai-shell" data-e3-global-ai data-ask-url="/admin/study-recall/assistant/ask">
    <section class="e3-ai-panel" data-e3-ai-panel aria-label="AI 學習助理" hidden>
        <header class="e3-ai-head">
            <div class="e3-ai-identity"><span class="e3-ai-mark">AI</span><div><strong>學習助理</strong><small data-e3-ai-page></small></div></div>
            <button class="e3-ai-reset" type="button" data-e3-ai-reset>清除對話</button>
        </header>
        <div class="e3-ai-messages" data-e3-ai-messages><div class="e3-ai-empty" data-e3-ai-empty><strong>直接說你想完成什麼</strong>我會讀取相關進度、計畫、時數、作業與筆記資料；涉及修改時會先整理成確認方案。</div></div>
        <form class="e3-ai-form" data-e3-ai-form>
            <div class="e3-ai-compose"><textarea class="e3-ai-input" data-e3-ai-input rows="1" maxlength="800" placeholder="例如：把落後時數平均排回原截止日前"></textarea><button class="e3-ai-send" type="submit" aria-label="送出"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div>
            <div class="e3-ai-hint"><span>Enter 送出 · Shift+Enter 換行</span><button type="button" data-e3-ai-example>試試智慧重排</button></div>
        </form>
    </section>
    <button class="e3-ai-launch" type="button" data-e3-ai-launch aria-label="開啟 AI 學習助理" aria-expanded="false"><svg class="chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg><svg class="close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
</aside>
<script>
(() => {
    const root = document.querySelector('[data-e3-global-ai]');
    if (!root || window.__e3GlobalAiMounted) return;
    window.__e3GlobalAiMounted = true;
    const panel = root.querySelector('[data-e3-ai-panel]');
    const launch = root.querySelector('[data-e3-ai-launch]');
    const messages = root.querySelector('[data-e3-ai-messages]');
    const empty = root.querySelector('[data-e3-ai-empty]');
    const form = root.querySelector('[data-e3-ai-form]');
    const input = root.querySelector('[data-e3-ai-input]');
    const send = form.querySelector('button[type="submit"]');
    const storeKey = 'e3-study-ai-global-v1';
    const historyKey = 'e3-study-ai-conversations-v2';
    let state = {messages:[],history:[]};
    let busy = false;
    const pageTitle = (document.querySelector('h1')?.textContent || document.title || '目前頁面').trim().slice(0,80);
    root.querySelector('[data-e3-ai-page]').textContent = pageTitle;
    const save = () => { try { const snapshot={messages:state.messages.slice(-30),history:state.history.slice(-12)};sessionStorage.setItem(storeKey,JSON.stringify(snapshot));const shared=JSON.parse(sessionStorage.getItem(historyKey)||'{}');shared[root.dataset.askUrl]={title:'AI 問答',mode:'general',style:'concise',messages:snapshot.messages.slice(-24),history:snapshot.history};sessionStorage.setItem(historyKey,JSON.stringify(shared)); } catch (_) {} };
    const appendMessage = (role, content, persist=true) => {
        empty?.remove();
        const node = document.createElement('div');
        node.className = `e3-ai-message ${role}`;
        node.textContent = String(content || '');
        messages.append(node); messages.scrollTop = messages.scrollHeight;
        if (persist) { state.messages.push({role,content:String(content || '')}); save(); }
        return node;
    };
    const renderProposal = (proposal, persist=true) => {
        empty?.remove();
        const card = document.createElement('section'); card.className='e3-ai-proposal';
        const head=document.createElement('div');head.className='e3-ai-proposal-head';
        const title=document.createElement('strong');title.textContent=proposal.title||'變更方案';
        const badge=document.createElement('span');badge.className='e3-ai-badge';badge.textContent=proposal.status==='applied'?'已驗證':(proposal.status==='reverted'?'已復原':'待確認');head.append(title,badge);card.append(head);
        if(proposal.summary){const p=document.createElement('p');p.textContent=proposal.summary;card.append(p)}
        if(Array.isArray(proposal.changes)&&proposal.changes.length){const list=document.createElement('div');list.className='e3-ai-changes';proposal.changes.forEach(change=>{const row=document.createElement('div');row.className='e3-ai-change';const label=document.createElement('span');label.textContent=change.label||'變更';const value=document.createElement('span');value.textContent=`${change.before||'—'} → ${change.after||'—'}`;row.append(label,value);list.append(row)});card.append(list)}
        const actions=document.createElement('div');actions.className='e3-ai-actions';
        if(proposal.resultMessage){const result=document.createElement('p');result.className='e3-ai-result';result.textContent=proposal.resultMessage;card.append(result)}
        if(proposal.status!=='applied'&&proposal.status!=='reverted'){const apply=document.createElement('button');apply.type='button';apply.className='e3-ai-action primary';apply.textContent='確認並套用';apply.addEventListener('click',async()=>{apply.disabled=true;apply.textContent='套用中…';try{const response=await fetch(proposal.apply_url,{method:'POST',credentials:'same-origin',headers:{Accept:'application/json'}});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.error||'暫時無法套用');if(result.verification?.verified!==true)throw new Error('資料庫尚未完成驗證，這次變更不會標示為完成。');proposal.status='applied';proposal.resultMessage=result.message||'已套用並回讀資料庫確認。';proposal.undo_url=result.undo?.url||'';badge.textContent='已驗證';actions.replaceChildren();if(proposal.undo_url){const undo=document.createElement('button');undo.type='button';undo.className='e3-ai-action';undo.textContent='復原';undo.addEventListener('click',()=>undoProposal(undo,proposal,badge,actions));actions.append(undo)}state.messages=state.messages.map(item=>item.kind==='proposal'&&item.id===proposal.id?{...item,proposal}:item);save();renderProposalResult(card,proposal.resultMessage)}catch(error){apply.disabled=false;apply.textContent='再次套用';appendMessage('error',error.message||'暫時無法套用')}});actions.append(apply)}
        else if(proposal.status==='applied'&&proposal.undo_url){const undo=document.createElement('button');undo.type='button';undo.className='e3-ai-action';undo.textContent='復原';undo.addEventListener('click',()=>undoProposal(undo,proposal,badge,actions));actions.append(undo)}
        card.append(actions);messages.append(card);messages.scrollTop=messages.scrollHeight;
        if(persist){state.messages.push({kind:'proposal',id:proposal.id,proposal});save()}
    };
    const renderProposalResult=(card,message)=>{let result=card.querySelector('.e3-ai-result');if(!result){result=document.createElement('p');result.className='e3-ai-result';card.insertBefore(result,card.querySelector('.e3-ai-actions'))}result.textContent=message||''};
    const undoProposal=async(button,proposal,badge,actions)=>{button.disabled=true;button.textContent='復原中…';try{const response=await fetch(proposal.undo_url,{method:'POST',credentials:'same-origin',headers:{Accept:'application/json'}});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.error||'暫時無法復原');if(result.verification?.verified!==true)throw new Error('資料庫尚未完成復原驗證。');proposal.status='reverted';proposal.resultMessage=result.message||'已復原並回讀資料庫確認。';badge.textContent='已復原';actions.replaceChildren();renderProposalResult(actions.closest('.e3-ai-proposal'),proposal.resultMessage);state.messages=state.messages.map(item=>item.kind==='proposal'&&item.id===proposal.id?{...item,proposal}:item);save()}catch(error){button.disabled=false;button.textContent='再次復原';appendMessage('error',error.message||'暫時無法復原')}};
    try { const saved=JSON.parse(sessionStorage.getItem(storeKey)||'{}'); if(saved&&Array.isArray(saved.messages)){state={messages:saved.messages.slice(-30),history:Array.isArray(saved.history)?saved.history.slice(-12):[]};state.messages.forEach(item=>item.kind==='proposal'?renderProposal(item.proposal,false):appendMessage(item.role,item.content,false));} else { const shared=JSON.parse(sessionStorage.getItem(historyKey)||'{}');const general=shared[root.dataset.askUrl];if(general&&Array.isArray(general.history))state.history=general.history.slice(-12); } } catch (_) {}
    const setOpen = open => {panel.hidden=!open;root.classList.toggle('is-open',open);launch.setAttribute('aria-expanded',open?'true':'false');launch.setAttribute('aria-label',open?'收合 AI 學習助理':'開啟 AI 學習助理');if(open)setTimeout(()=>input.focus(),30)};
    launch.addEventListener('click',()=>setOpen(panel.hidden));
    root.querySelector('[data-e3-ai-reset]').addEventListener('click',()=>{state={messages:[],history:[]};messages.replaceChildren();const fresh=document.createElement('div');fresh.className='e3-ai-empty';fresh.innerHTML='<strong>新的對話</strong>直接說明你想查詢或調整的內容。';messages.append(fresh);sessionStorage.removeItem(storeKey)});
    root.querySelector('[data-e3-ai-example]').addEventListener('click',()=>{input.value='請幫我重排計畫時數，讓我可以在原訂時間內完成，並把目前落後的時數平均分攤進去。';input.focus();input.dispatchEvent(new Event('input'))});
    input.addEventListener('input',()=>{input.style.height='auto';input.style.height=`${Math.min(112,Math.max(38,input.scrollHeight))}px`});
    input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});
    form.addEventListener('submit',async event=>{event.preventDefault();const question=input.value.trim();if(!question||busy)return;busy=true;send.disabled=true;appendMessage('user',question);state.history.push({role:'user',content:question});input.value='';input.style.height='auto';const pending=appendMessage('assistant','',false);pending.innerHTML='<span class="e3-ai-thinking"><i></i><i></i><i></i></span>';try{const response=await fetch(root.dataset.askUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({question,history:state.history.slice(-10),response_style:'concise',page_context:{path:location.pathname,title:pageTitle}})});const result=await response.json().catch(()=>({}));pending.remove();if(!response.ok||!result.ok)throw new Error(result.error||'AI 助理暫時無法回答');appendMessage('assistant',result.answer||'已完成分析。');state.history.push({role:'assistant',content:result.answer||''});if(result.proposal)renderProposal({...result.proposal,status:'pending'});save()}catch(error){pending.remove();appendMessage('error',error.message||'AI 助理暫時無法回答')}finally{busy=false;send.disabled=false;input.focus()}});
})();
</script>
{% endif %}
