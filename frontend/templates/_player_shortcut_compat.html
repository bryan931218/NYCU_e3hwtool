<style>
    /* The main video surface belongs to our controls; the bottom strip remains YouTube-native. */
    .player-frame.is-focus-mode .focus-keyboard-capture {
        pointer-events: auto !important;
        inset: 0 0 78px 0 !important;
        width: auto !important;
        height: auto !important;
        min-width: 0 !important;
        min-height: 0 !important;
        padding: 0 !important;
        opacity: 1 !important;
        z-index: 1 !important;
        background: transparent !important;
        cursor: pointer !important;
        touch-action: manipulation;
    }

    /* Let real pointer movement reach the cross-origin YouTube player so its
       native timeline and controls can wake up together with our dock. */
    .player-frame.is-focus-mode.e3-native-controls-active .focus-keyboard-capture {
        pointer-events: none !important;
        right: 0 !important;
    }

    /* Hints are controlled explicitly and never shown again merely because focus moved. */
    .player-frame.is-focus-mode .focus-layer:hover .focus-shortcut-hint,
    .player-frame.is-focus-mode .focus-keyboard-capture:focus + .focus-shortcut-hint {
        opacity: 0 !important;
    }
    .player-frame.is-focus-mode.e3-show-shortcut-hint .focus-shortcut-hint {
        opacity: 1 !important;
    }
</style>
<script>
(() => {
    if (window.__e3PlayerShortcutCompatibilityInstalled) return;
    window.__e3PlayerShortcutCompatibilityInstalled = true;

    const DEFAULT_SETTINGS = {
        hold_space_rate: 2,
        hold_delay_ms: 300,
        seek_seconds: 10,
        center_click_toggle: true,
        show_shortcut_hint: true,
        hint_duration_ms: 1400,
    };
    const settings = { ...DEFAULT_SETTINGS };
    window.E3PlayerSettings = settings;

    // YouTube replaces <div id="youtube-player"> with <iframe id="youtube-player">.
    const nativeQuerySelector = Document.prototype.querySelector;
    Document.prototype.querySelector = function (selector) {
        if (selector === '#youtube-player iframe') {
            return nativeQuerySelector.call(this, selector)
                || nativeQuerySelector.call(this, 'iframe#youtube-player');
        }
        return nativeQuerySelector.call(this, selector);
    };

    const frame = document.getElementById('focus-player-frame');
    const capture = document.getElementById('focus-keyboard-capture');
    const panel = document.getElementById('youtube-player-section');
    const hint = document.querySelector('.focus-shortcut-hint');
    const toast = document.getElementById('focus-toast');
    if (!frame || !capture || !panel) return;

    capture.tabIndex = 0;
    capture.removeAttribute('aria-hidden');

    const nav = document.querySelector('.nav-links');
    if (nav && !nav.querySelector('[data-player-settings-link]')) {
        const link = document.createElement('a');
        link.href = '/admin/study-player-settings';
        link.textContent = '播放器設定';
        link.dataset.playerSettingsLink = '1';
        nav.appendChild(link);
    }

    let wasFocusMode = false;
    let hintTimer = null;
    let nativeControlsTimer = null;
    let toastTimer = null;
    let holdTimer = null;
    let heldSeekCode = '';
    let lastSeekAt = 0;
    let spaceDown = false;
    let longPress = false;
    let boostActive = false;
    let currentRate = 1;
    let previousRate = 1;
    let playerState = -1;
    let currentTime = 0;
    let duration = 0;

    const playerIframe = () => nativeQuerySelector.call(document, 'iframe#youtube-player')
        || nativeQuerySelector.call(document, '#youtube-player iframe');
    const playerReady = () => !panel.classList.contains('is-hidden') && Boolean(playerIframe());
    const isFocusMode = () => frame.classList.contains('is-focus-mode');
    const formatRate = (rate) => Number(rate || 1).toFixed(2).replace(/\.00$/, '').replace(/0$/, '');
    const updateHintText = () => {
        const seconds = Math.max(1, Number(settings.seek_seconds) || 10);
        const rate = formatRate(settings.hold_space_rate);
        const text = `R 快速紀錄　M 靜音　J／← 後退 ${seconds} 秒　L／→ 快進 ${seconds} 秒（長按連續）　短按空白鍵播放／暫停　長按 ${settings.hold_delay_ms}ms ${rate}×`;
        if (hint) hint.textContent = text;
        capture.setAttribute('aria-label', `播放器鍵盤控制區；${text}`);
    };
    const showToast = (message) => {
        if (!toast || !message) return;
        if (toastTimer) window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.remove('is-error');
        toast.classList.add('is-visible');
        toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1100);
    };
    const focusCapture = () => {
        if (!isFocusMode()) return;
        try { capture.focus({ preventScroll: true }); }
        catch (error) { capture.focus(); }
    };
    const sendCommand = (func, args = []) => {
        const iframe = playerIframe();
        if (!iframe || !iframe.contentWindow) return false;
        iframe.contentWindow.postMessage(JSON.stringify({
            event: 'command',
            func,
            args,
        }), '*');
        return true;
    };
    const togglePlayback = () => {
        if (playerState === 1) {
            sendCommand('pauseVideo');
            playerState = 2;
        } else {
            sendCommand('playVideo');
            playerState = 1;
        }
    };
    const seekBy = (deltaSeconds) => {
        const base = Number.isFinite(currentTime) ? currentTime : 0;
        const end = Number.isFinite(duration) && duration > 0 ? duration : Number.POSITIVE_INFINITY;
        const next = Math.max(0, Math.min(end, base + deltaSeconds));
        if (!sendCommand('seekTo', [next, true])) return;
        currentTime = next;
        showToast(`${deltaSeconds < 0 ? '後退' : '快進'} ${Math.abs(deltaSeconds)} 秒`);
    };
    const SEEK_REPEAT_THROTTLE_MS = 150;
    const seekDirections = {
        KeyJ: -1,
        ArrowLeft: -1,
        KeyL: 1,
        ArrowRight: 1,
    };
    const stopContinuousSeek = (code = '') => {
        if (code && heldSeekCode && code !== heldSeekCode) return;
        heldSeekCode = '';
        lastSeekAt = 0;
    };
    const seekOnKeyDown = (event, direction) => {
        const now = typeof window.performance?.now === 'function'
            ? window.performance.now()
            : Date.now();
        const seekStep = Math.max(1, Number(settings.seek_seconds) || 10);
        if (!event.repeat || heldSeekCode !== event.code) {
            heldSeekCode = event.code;
            lastSeekAt = now;
            seekBy(direction * seekStep);
            return;
        }
        if (now - lastSeekAt < SEEK_REPEAT_THROTTLE_MS) return;
        lastSeekAt = now;
        seekBy(direction * seekStep);
    };
    const clearHoldTimer = () => {
        if (holdTimer) window.clearTimeout(holdTimer);
        holdTimer = null;
    };
    const restorePlaybackRate = () => {
        if (!boostActive) return;
        boostActive = false;
        sendCommand('setPlaybackRate', [previousRate]);
        currentRate = previousRate;
        showToast(`恢復 ${formatRate(previousRate)}×`);
    };
    const resetSpace = (restoreRate = true) => {
        clearHoldTimer();
        if (restoreRate) restorePlaybackRate();
        spaceDown = false;
        longPress = false;
    };
    const isTypingTarget = (target) => Boolean(target && target !== capture && (
        ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(target.tagName)
        || target.isContentEditable
    ));
    const isBlockedShortcut = (event) => (
        event.isComposing
        || isTypingTarget(event.target)
        || event.altKey
        || event.ctrlKey
        || event.metaKey
        || !playerReady()
    );
    const consume = (event) => {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
    };

    const activateShortcutSurface = () => {
        if (!isFocusMode()) return;
        frame.classList.remove('e3-native-controls-active');
        if (nativeControlsTimer) window.clearTimeout(nativeControlsTimer);
        nativeControlsTimer = null;
        focusCapture();
    };
    const showHintOnce = () => {
        if (!settings.show_shortcut_hint) return;
        if (hintTimer) window.clearTimeout(hintTimer);
        frame.classList.add('e3-show-shortcut-hint');
        hintTimer = window.setTimeout(() => {
            frame.classList.remove('e3-show-shortcut-hint');
        }, settings.hint_duration_ms);
    };
    const releaseForNativeControls = () => {
        resetSpace(true);
        stopContinuousSeek();
        if (!isFocusMode()) return;
        if (nativeControlsTimer) window.clearTimeout(nativeControlsTimer);
        frame.classList.add('e3-native-controls-active');
        nativeControlsTimer = window.setTimeout(() => {
            frame.classList.remove('e3-native-controls-active');
            nativeControlsTimer = null;
        }, 3400);
    };
    const syncFocusMode = () => {
        const active = isFocusMode();
        if (active && !wasFocusMode) {
            wasFocusMode = true;
            frame.classList.remove('e3-native-controls-active');
            showHintOnce();
            window.setTimeout(focusCapture, 0);
        } else if (!active && wasFocusMode) {
            wasFocusMode = false;
            resetSpace(true);
            stopContinuousSeek();
            frame.classList.remove('e3-native-controls-active', 'e3-show-shortcut-hint');
            if (hintTimer) window.clearTimeout(hintTimer);
            if (nativeControlsTimer) window.clearTimeout(nativeControlsTimer);
            hintTimer = null;
            nativeControlsTimer = null;
        }
    };

    // Keep the existing main-player click handler, but allow it to be disabled in settings.
    capture.addEventListener('click', (event) => {
        if (settings.center_click_toggle) return;
        event.preventDefault();
        event.stopImmediatePropagation();
    }, true);
    capture.addEventListener('pointerenter', activateShortcutSurface);
    capture.addEventListener('pointermove', releaseForNativeControls, { passive: true });
    capture.addEventListener('pointerdown', activateShortcutSurface);

    // Capture all custom shortcuts at window level so the old handler and YouTube
    // iframe cannot also process the same key press.
    window.addEventListener('keydown', (event) => {
        const direction = seekDirections[event.code];
        if (direction) {
            if (isBlockedShortcut(event)) return;
            consume(event);
            seekOnKeyDown(event, direction);
            return;
        }

        if (event.code !== 'Space' || isBlockedShortcut(event)) return;
        consume(event);
        if (spaceDown || event.repeat) return;

        spaceDown = true;
        longPress = false;
        holdTimer = window.setTimeout(() => {
            if (!spaceDown) return;
            longPress = true;
            previousRate = Number.isFinite(currentRate) && currentRate > 0 ? currentRate : 1;
            boostActive = true;
            sendCommand('setPlaybackRate', [settings.hold_space_rate]);
            currentRate = settings.hold_space_rate;
            showToast(`暫時 ${formatRate(settings.hold_space_rate)}×`);
        }, settings.hold_delay_ms);
    }, true);

    window.addEventListener('keyup', (event) => {
        if (seekDirections[event.code]) {
            if (heldSeekCode === event.code) consume(event);
            stopContinuousSeek(event.code);
            return;
        }
        if (event.code !== 'Space' || !spaceDown) return;
        consume(event);
        clearHoldTimer();
        if (longPress) restorePlaybackRate();
        else togglePlayback();
        spaceDown = false;
        longPress = false;
    }, true);

    // Track authoritative YouTube state, rate and position updates from the API iframe.
    window.addEventListener('message', (event) => {
        const iframe = playerIframe();
        if (!iframe || event.source !== iframe.contentWindow) return;
        let payload = event.data;
        if (typeof payload === 'string') {
            try { payload = JSON.parse(payload); }
            catch (error) { return; }
        }
        const info = payload && payload.info;
        if (!info || typeof info !== 'object') return;
        if (Number.isFinite(Number(info.playerState))) playerState = Number(info.playerState);
        if (Number.isFinite(Number(info.currentTime))) currentTime = Math.max(0, Number(info.currentTime));
        if (Number.isFinite(Number(info.duration))) duration = Math.max(0, Number(info.duration));
        if (!boostActive && Number.isFinite(Number(info.playbackRate)) && Number(info.playbackRate) > 0) {
            currentRate = Number(info.playbackRate);
        }
    });

    window.addEventListener('blur', releaseForNativeControls);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            resetSpace(true);
            stopContinuousSeek();
        }
    });

    const observer = new MutationObserver(syncFocusMode);
    observer.observe(frame, { attributes: true, attributeFilter: ['class'] });
    document.addEventListener('fullscreenchange', syncFocusMode);
    document.addEventListener('webkitfullscreenchange', syncFocusMode);

    fetch('/admin/study-player-settings.json', {
        credentials: 'same-origin',
        cache: 'no-store',
        headers: { Accept: 'application/json' },
    })
        .then((response) => response.ok ? response.json() : null)
        .then((payload) => {
            if (!payload || !payload.ok || !payload.settings) return;
            Object.assign(settings, payload.settings);
            updateHintText();
        })
        .catch(() => null);

    updateHintText();
    syncFocusMode();
})();
</script>
