name: Player settings validation

on:
  push:
    branches:
      - agent/fix-player-and-persistent-sync
  pull_request:
    paths:
      - backend/e3_tracker/shared/deployment_runtime.py
      - backend/tests/test_player_settings.py
      - frontend/templates/_player_shortcut_compat.html
      - frontend/templates/admin_study_player_settings.html

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install targeted dependencies
        run: python -m pip install Flask SQLAlchemy fsrs Pillow
      - name: Compile Python
        run: |
          python -m py_compile backend/e3_tracker/shared/deployment_runtime.py
          python -m py_compile backend/tests/test_player_settings.py
      - name: Run player settings tests
        working-directory: backend
        run: python -m unittest tests.test_player_settings
      - name: Check player JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path('frontend/templates/_player_shortcut_compat.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', source, flags=re.S)
          if not scripts:
              raise SystemExit('No script block found')
          Path('/tmp/player-shortcuts.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/player-shortcuts.js
