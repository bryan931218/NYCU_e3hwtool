<script type="application/json" id="workbench-config">

    'preferencesUrl': url_for('save_preferences', view_user=viewed_username) if is_admin_view else url_for('save_preferences'),
    'cacheUrl': url_for('api_cache', view_user=viewed_username) if is_admin_view else url_for('api_cache'),
    'eventUrl': url_for('ui_event'),

    'guest': guest_mode|default(false),
    'announcementVersion': announcement_version|default('', true),
    'statsVersion': stats_version|default(0),
    'statsUrl': url_for('traffic_stats')
} | tojson }}
