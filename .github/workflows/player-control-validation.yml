name: Player control validation

on:
  pull_request:
    paths:
      - backend/e3_tracker/shared/player_control_runtime.py
      - backend/server.py
      - backend/wsgi.py
      - backend/tests/test_player_settings.py
      - frontend/templates/_player_control_dock.html

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install targeted dependencies
        run: python -m pip install Flask SQLAlchemy fsrs Pillow python-dotenv
      - name: Compile Python
        run: |
          python -m py_compile backend/e3_tracker/shared/player_control_runtime.py
          python -m py_compile backend/server.py
          python -m py_compile backend/wsgi.py
          python -m py_compile backend/tests/test_player_settings.py
      - name: Run player tests
        working-directory: backend
        run: python -m unittest tests.test_player_settings
      - name: Check player JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path('frontend/templates/_player_control_dock.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', source, flags=re.S)
          if not scripts:
              raise SystemExit('No player scripts found')
          Path('/tmp/player-controls.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/player-controls.js
