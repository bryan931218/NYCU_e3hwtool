<script>
(() => {
    const videoSelect = document.getElementById('video_id');
    const playerPanel = document.getElementById('youtube-player-section');
    const playerStudyTime = document.getElementById('player-study-time');
    const todayStudyTime = document.getElementById('today-study-time');
    const todayVideoTime = document.getElementById('today-video-time');
    const todayPracticeTime = document.getElementById('today-practice-time');
    const historyList = document.getElementById('study-time-history-list');
    const historyEmpty = document.getElementById('study-time-history-empty');
    const syncStatus = document.getElementById('study-time-sync-status');
    if (!videoSelect || !playerPanel || !playerStudyTime) return;

    const endpoint = '/admin/study-plan/study-time';
    const nativeFetch = window.fetch.bind(window);
    let activeSession = null;
    let pulseTimer = null;
    let clockTimer = null;

    const requestPath = (input) => {
        try {
            const value = typeof input === 'string' ? input : input && input.url;
            return new URL(value, window.location.href).pathname;
        } catch (error) {
            return '';
        }
    };

    // The page's original timer only counts while YouTube reports PLAYING.
    // Suppress those legacy video-time writes; this controller records one
    // continuous session for the entire time a video player remains open.
    window.fetch = function (input, init) {
        if (requestPath(input) === endpoint && String((init && init.method) || 'GET').toUpperCase() === 'POST') {
            try {
                const payload = JSON.parse((init && init.body) || '{}');
                if (payload.kind === 'video') {
                    return Promise.resolve(new Response(JSON.stringify({ ok: true, today: null }), {
                        status: 200,
                        headers: { 'Content-Type': 'application/json' }
                    }));
                }
            } catch (error) {}
        }
        return nativeFetch(input, init);
    };

    const makeSessionId = () => {
        const random = window.crypto && typeof window.crypto.randomUUID === 'function'
            ? window.crypto.randomUUID().replace(/-/g, '')
            : Math.random().toString(36).slice(2) + Date.now().toString(36);
        return `video_open_${random}`.slice(0, 80);
    };

    const formatClock = (seconds) => {
        const value = Math.max(0, Math.floor(Number(seconds) || 0));
        const minutes = Math.floor(value / 60);
        return `${minutes}:${String(value % 60).padStart(2, '0')}`;
    };

    const formatLongClock = (seconds) => {
        const value = Math.max(0, Math.floor(Number(seconds) || 0));
        const hours = Math.floor(value / 3600);
        const minutes = Math.floor((value % 3600) / 60);
        const rest = value % 60;
        return [hours, minutes, rest].map((part) => String(part).padStart(2, '0')).join(':');
    };

    const elapsedSeconds = (session = activeSession) => session
        ? Math.max(0, (Date.now() - session.startedAt) / 1000)
        : 0;

    const selectedVideo = () => {
        const option = videoSelect.options[videoSelect.selectedIndex];
        if (!option || !option.value || !option.dataset.youtubeVideoId) return null;
        if (playerPanel.classList.contains('is-hidden')) return null;
        return {
            videoId: Number(option.value),
            label: option.dataset.title || '影片學習'
        };
    };

    const renderHistory = (sessions) => {
        if (!historyList || !historyEmpty || !Array.isArray(sessions)) return;
        historyList.textContent = '';
        historyEmpty.hidden = sessions.length > 0;
        sessions.forEach((session) => {
            const item = document.createElement('div');
            item.className = 'study-time-history-item';

            const kind = document.createElement('span');
            kind.className = `study-time-kind ${session.kind === 'practice' ? 'practice' : 'video'}`;
            kind.textContent = session.kind === 'practice' ? '刷題' : '影片';

            const label = document.createElement('span');
            label.className = 'study-time-history-label';
            label.textContent = session.label || (session.kind === 'practice' ? '刷題' : '影片學習');

            const duration = document.createElement('span');
            duration.className = 'study-time-history-duration';
            duration.textContent = formatLongClock(session.elapsed_seconds || 0);

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'study-time-delete';
            remove.dataset.deleteStudyTime = session.session_id || '';
            remove.textContent = '刪除';

            item.append(kind, label, duration, remove);
            historyList.appendChild(item);
        });
    };

    const applySummary = (today) => {
        if (!today) return;
        if (todayStudyTime) todayStudyTime.textContent = `${(Number(today.total_seconds || 0) / 3600).toFixed(2)}h`;
        if (todayVideoTime) todayVideoTime.textContent = `${(Number(today.video_seconds || 0) / 3600).toFixed(2)}h`;
        if (todayPracticeTime) todayPracticeTime.textContent = `${(Number(today.practice_seconds || 0) / 3600).toFixed(2)}h`;
        renderHistory(today.sessions);
    };

    const postSession = (session, completed, keepalive) => {
        if (!session) return Promise.resolve(null);
        if (syncStatus && !keepalive) syncStatus.textContent = completed ? '儲存中…' : '同步中…';
        return nativeFetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                session_id: session.id,
                kind: 'video',
                video_id: session.videoId,
                label: session.label,
                elapsed_seconds: elapsedSeconds(session),
                completed: Boolean(completed)
            }),
            keepalive: Boolean(keepalive)
        }).then((response) => {
            if (!response.ok) throw new Error('study_time_not_saved');
            return response.json();
        }).then((result) => {
            applySummary(result.today);
            if (syncStatus) syncStatus.textContent = '已同步';
            return result;
        }).catch(() => {
            if (syncStatus && !keepalive) syncStatus.textContent = '同步失敗，稍後重試';
            return null;
        });
    };

    const renderClock = () => {
        playerStudyTime.textContent = formatClock(elapsedSeconds());
    };

    const finishActiveSession = (keepalive = false) => {
        const finished = activeSession;
        activeSession = null;
        renderClock();
        return finished ? postSession(finished, true, keepalive) : Promise.resolve(null);
    };

    const syncSelectedPlayer = () => {
        const video = selectedVideo();
        if (!video) {
            finishActiveSession(false);
            return;
        }
        if (activeSession && activeSession.videoId === video.videoId) return;
        const previous = activeSession;
        activeSession = {
            id: makeSessionId(),
            videoId: video.videoId,
            label: video.label,
            startedAt: Date.now()
        };
        renderClock();
        if (previous) postSession(previous, true, false);
    };

    videoSelect.addEventListener('change', () => {
        window.setTimeout(syncSelectedPlayer, 0);
    });

    pulseTimer = window.setInterval(() => {
        if (activeSession) postSession(activeSession, false, false);
    }, 15000);
    clockTimer = window.setInterval(renderClock, 500);

    window.addEventListener('beforeunload', () => {
        if (pulseTimer) window.clearInterval(pulseTimer);
        if (clockTimer) window.clearInterval(clockTimer);
        if (activeSession) postSession(activeSession, true, true);
    });

    syncSelectedPlayer();
    renderClock();
})();
</script>
