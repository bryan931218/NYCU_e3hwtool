<style>
    .calendar-time-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
        margin-bottom: 4px;
    }

    .calendar-time-summary-card {
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #f8fbfe;
    }

    .calendar-time-summary-card.is-video {
        border-color: #c9ddf7;
        background: #f1f7ff;
    }

    .calendar-time-summary-card.is-study {
        border-color: #c6e9d8;
        background: #f0fbf5;
    }

    .calendar-time-summary-card span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 850;
    }

    .calendar-time-summary-card strong {
        display: block;
        margin-top: 5px;
        overflow: hidden;
        color: var(--ink);
        font-size: 16px;
        font-weight: 950;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    @media (max-width: 390px) {
        .calendar-time-summary-card {
            padding: 10px 8px;
        }
        .calendar-time-summary-card strong {
            font-size: 14px;
        }
    }
</style>
<script>
(() => {
    const installKey = '__e3StudyCalendarTimeSplitInstalled';
    if (window[installKey]) return;
    window[installKey] = true;

    const root = document.querySelector('[data-study-calendar]');
    const dataNode = root?.querySelector('[data-calendar-data]');
    const grid = root?.querySelector('[data-calendar-grid]');
    if (!root || !dataNode || !grid) return;

    let calendarPayload = {};
    try {
        calendarPayload = JSON.parse(dataNode.textContent || '{}');
    } catch (error) {
        return;
    }

    const firstMonth = String(
        calendarPayload.first_month || calendarPayload.initial_month || '',
    ).slice(0, 7);
    const todayKey = String(calendarPayload.today || '');
    if (!/^\d{4}-\d{2}$/.test(firstMonth) || !/^\d{4}-\d{2}-\d{2}$/.test(todayKey)) {
        return;
    }

    const originalDayByKey = new Map(
        (Array.isArray(calendarPayload.days) ? calendarPayload.days : [])
            .map((item) => [String(item?.date || ''), item]),
    );
    const studySecondsByDay = new Map();
    const pad = (value) => String(value).padStart(2, '0');
    const secondsValue = (value) => Math.max(0, Number(value) || 0);

    const compactDuration = (seconds) => {
        const value = secondsValue(seconds);
        if (value <= 0) return '';
        if (value < 3600) return `${Math.max(1, Math.round(value / 60))}m`;
        const hours = value / 3600;
        return `${hours >= 10 ? Math.round(hours) : hours.toFixed(1).replace('.0', '')}h`;
    };

    const summaryDuration = (seconds) => {
        const value = secondsValue(seconds);
        if (value <= 0) return '0h';
        if (value < 3600) return `${Math.max(1, Math.round(value / 60))} 分`;
        return `${(value / 3600).toFixed(1).replace('.0', '')}h`;
    };

    const fullDuration = (seconds) => {
        const value = secondsValue(seconds);
        if (value <= 0) return '0 分鐘';
        const minutes = Math.max(1, Math.round(value / 60));
        const hours = Math.floor(minutes / 60);
        const remainder = minutes % 60;
        if (!hours) return `${minutes} 分鐘`;
        return `${hours} 小時${remainder ? ` ${remainder} 分鐘` : ''}`;
    };

    const spokenDate = (key) => {
        const [year, month, day] = key.split('-').map(Number);
        const value = new Date(year, month - 1, day);
        const weekday = [
            '星期日', '星期一', '星期二', '星期三',
            '星期四', '星期五', '星期六',
        ][value.getDay()];
        return `${month} 月 ${day} 日・${weekday}`;
    };

    const totalStudySeconds = (key) => secondsValue(studySecondsByDay.get(key));
    const videoWatchSeconds = (key) => {
        const detail = originalDayByKey.get(key) || {};
        return secondsValue(detail.seconds);
    };

    const visiblePrefix = () => {
        const firstCell = grid.querySelector('.calendar-day[data-date]');
        if (firstCell?.dataset.date) return firstCell.dataset.date.slice(0, 7);
        const heading = root.querySelector('[data-calendar-heading]')?.textContent || '';
        const match = heading.match(/(\d{4})\s*年\s*(\d{1,2})\s*月/);
        return match ? `${match[1]}-${pad(match[2])}` : firstMonth;
    };

    const applyOriginalHeat = (cell, seconds, monthMaximum) => {
        if (seconds <= 0 || monthMaximum <= 0) {
            cell.style.background = 'linear-gradient(145deg, #fbfdff 0%, #edf3f9 100%)';
            cell.style.setProperty('--calendar-cell-border', '#e2eaf3');
            cell.style.color = '#17324d';
            return;
        }
        const ratio = Math.min(1, Math.max(0, seconds / monthMaximum));
        const intensity = Math.pow(ratio, .72);
        const hue = Math.round(211 + intensity * 10);
        const saturation = Math.round(76 + intensity * 14);
        const topLightness = Math.round(97 - intensity * 43);
        const bottomLightness = Math.round(94 - intensity * 54);
        const borderLightness = Math.max(35, bottomLightness - 5);
        cell.style.background = `linear-gradient(145deg, hsl(${hue}, ${saturation}%, ${topLightness}%) 0%, hsl(${hue + 3}, ${saturation}%, ${bottomLightness}%) 100%)`;
        cell.style.setProperty(
            '--calendar-cell-border',
            `hsla(${hue}, ${saturation}%, ${borderLightness}%, .38)`,
        );
        cell.style.color = intensity >= .54 ? '#fff' : '#17324d';
    };

    const updateStaticCopy = () => {
        root.setAttribute('aria-label', '每月影片觀看時間熱度月曆');
        const totalLabel = root.querySelector('.calendar-total-label');
        const caption = root.querySelector('.calendar-caption');
        if (totalLabel) totalLabel.textContent = '這個月累積影片觀看時間';
        if (caption) {
            caption.textContent = '格子顏色依每日影片觀看時間計算；點選日期可查看影片與實際學習時間。';
        }
        grid.setAttribute('aria-label', '每日影片觀看時間');
    };

    const decorateCells = () => {
        const prefix = visiblePrefix();
        const monthMaximum = Math.max(
            0,
            ...[...originalDayByKey.entries()]
                .filter(([key]) => key.startsWith(`${prefix}-`))
                .map(([, item]) => secondsValue(item?.seconds)),
        );
        grid.querySelectorAll('.calendar-day[data-date]').forEach((cell) => {
            const key = String(cell.dataset.date || '');
            const videoSeconds = videoWatchSeconds(key);
            const signature = `${videoSeconds}|${monthMaximum}`;
            if (cell.dataset.e3VideoHeatSignature === signature) return;
            cell.dataset.e3VideoHeatSignature = signature;
            applyOriginalHeat(cell, videoSeconds, monthMaximum);
            const duration = cell.querySelector('.calendar-duration');
            if (duration) duration.textContent = compactDuration(videoSeconds);
            cell.setAttribute(
                'aria-label',
                `${spokenDate(key)}，影片觀看時間 ${fullDuration(videoSeconds)}`,
            );
        });
    };

    const updateMonthSummary = () => {
        const prefix = visiblePrefix();
        const rows = [...originalDayByKey.entries()]
            .map(([key, item]) => [key, secondsValue(item?.seconds)])
            .filter(([key, seconds]) => (
                key.startsWith(`${prefix}-`) && seconds > 0
            ))
            .sort(([left], [right]) => left.localeCompare(right));
        const total = rows.reduce((sum, [, seconds]) => sum + seconds, 0);
        const best = rows.reduce(
            (winner, item) => (!winner || item[1] > winner[1] ? item : winner),
            null,
        );
        const totalNode = root.querySelector('[data-calendar-total]');
        const activeNode = root.querySelector('[data-calendar-active-days]');
        const averageNode = root.querySelector('[data-calendar-average]');
        const bestNode = root.querySelector('[data-calendar-best]');
        if (totalNode) totalNode.textContent = summaryDuration(total);
        if (activeNode) activeNode.textContent = `${rows.length} 天`;
        if (averageNode) {
            averageNode.textContent = rows.length
                ? summaryDuration(total / rows.length)
                : '0 分';
        }
        if (bestNode) {
            bestNode.textContent = best
                ? `${Number(best[0].slice(5, 7))}/${Number(best[0].slice(8, 10))}・${summaryDuration(best[1])}`
                : '尚無紀錄';
        }
    };

    const updateFocus = (key) => {
        if (!key) return;
        const dateNode = root.querySelector('[data-calendar-focus-date]');
        const durationNode = root.querySelector('[data-calendar-focus-duration]');
        if (dateNode) dateNode.textContent = spokenDate(key);
        if (durationNode) {
            durationNode.textContent = `影片觀看時間 ${fullDuration(videoWatchSeconds(key))}`;
        }
    };

    const selectedKey = () => (
        grid.querySelector('.calendar-day.is-selected[data-date]')?.dataset.date
        || grid.querySelector('.calendar-day[data-date]')?.dataset.date
        || todayKey
    );

    const updateModal = (key) => {
        const modal = document.querySelector('[data-calendar-modal]');
        const summary = modal?.querySelector('[data-calendar-modal-summary]');
        const list = modal?.querySelector('[data-calendar-modal-list]');
        if (!modal || modal.hidden || !summary || !list || !key) return;

        const detail = originalDayByKey.get(key) || {};
        const activities = Array.isArray(detail.activities) ? detail.activities : [];
        const progressedCount = activities.filter((item) => !item?.is_correction).length;
        const videoSeconds = videoWatchSeconds(key);
        const studySeconds = totalStudySeconds(key);

        summary.textContent = `${progressedCount} 支影片有進度`;
        list.querySelector('.calendar-time-summary')?.remove();

        const cards = document.createElement('section');
        cards.className = 'calendar-time-summary';
        cards.setAttribute('aria-label', '當日影片與學習時間統計');
        cards.innerHTML = [
            `<div class="calendar-time-summary-card is-video"><span>影片觀看時間</span><strong>${fullDuration(videoSeconds)}</strong></div>`,
            `<div class="calendar-time-summary-card is-study"><span>實際學習時間</span><strong>${fullDuration(studySeconds)}</strong></div>`,
        ].join('');
        list.prepend(cards);
    };

    const refreshVisibleCalendar = () => {
        updateStaticCopy();
        decorateCells();
        updateMonthSummary();
        const key = selectedKey();
        updateFocus(key);
        updateModal(key);
    };

    let refreshQueued = false;
    const queueRefresh = () => {
        if (refreshQueued) return;
        refreshQueued = true;
        window.requestAnimationFrame(() => {
            refreshQueued = false;
            refreshVisibleCalendar();
        });
    };

    new MutationObserver(queueRefresh).observe(grid, {
        childList: true,
        subtree: true,
    });

    grid.addEventListener('click', (event) => {
        const cell = event.target.closest('.calendar-day[data-date]');
        if (!cell) return;
        window.setTimeout(() => {
            updateFocus(cell.dataset.date);
            updateModal(cell.dataset.date);
        }, 0);
    });

    const modal = document.querySelector('[data-calendar-modal]');
    if (modal) {
        new MutationObserver(() => {
            if (!modal.hidden) updateModal(selectedKey());
        }).observe(modal, { attributes: true, attributeFilter: ['hidden'] });
    }

    const endpoint = [
        '/admin/study-calendar/time-summary.json',
        `?start=${encodeURIComponent(`${firstMonth}-01`)}`,
        `&end=${encodeURIComponent(todayKey)}`,
    ].join('');

    fetch(endpoint, {
        credentials: 'same-origin',
        cache: 'no-store',
        headers: { Accept: 'application/json' },
    })
        .then((response) => {
            if (!response.ok) throw new Error('calendar_time_fetch_failed');
            return response.json();
        })
        .then((payload) => {
            if (!payload?.ok || !Array.isArray(payload.days)) return;
            payload.days.forEach((item) => {
                const key = String(item?.date || '');
                if (/^\d{4}-\d{2}-\d{2}$/.test(key)) {
                    studySecondsByDay.set(key, secondsValue(item.total_seconds));
                }
            });
            refreshVisibleCalendar();
        })
        .catch(() => {
            // Video heat still works; actual learning time remains unavailable in the modal.
        });
})();
</script>
